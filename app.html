<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="app-page">

    <div class="app-layout">
        <!-- SIDEBAR NAVIGATION -->
        <aside class="sidebar">
            <a href="index.html" class="logo-app">N</a>
            <nav class="mode-switcher">
                <button class="mode-btn active" data-mode="dev" title="Developer Mode">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                </button>
                <button class="mode-btn" data-mode="trader" title="Trader Mode">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                </button>
                <button class="mode-btn" data-mode="social" title="Social Content Mode">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="settings-btn" data-action="toggle-settings" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="chat-container">
                <!-- Welcome Message -->
                <div class="welcome-message" data-lang-key="welcome.title">
                    <h1 class="font-bold text-2xl" data-lang-key="welcome.header">Welcome to Nexora</h1>
                    <p class="text-muted" data-lang-key="welcome.subheader">Select a mode and start your amplified thinking.</p>
                </div>
                
                <!-- Conversation Area -->
                <div class="conversation-area" data-conversation-area></div>

                <!-- Loading Indicator -->
                <div class="loading-indicator" data-loading-indicator style="display: none;">
                    <div class="spinner"></div>
                    <p data-lang-key="status.thinking">Thinking...</p>
                </div>
            </div>

            <!-- INPUT FORM AREA -->
            <div class="input-area">
                <form class="input-form" data-input-form>
                    <!-- This content is dynamically generated by JS based on the mode -->
                    <div class="dynamic-input-controls" data-dynamic-controls></div>
                    <textarea data-prompt-input placeholder="Type your message or paste code here..." class="prompt-input" rows="1"></textarea>
                    <button type="submit" class="submit-btn" title="Send (Enter)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </main>

        <!-- SETTINGS PANEL -->
        <div class="settings-panel" data-settings-panel>
            <div class="settings-header">
                <h2 data-lang-key="settings.title">Settings</h2>
                <button class="close-btn" data-action="toggle-settings">&times;</button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="language-select" data-lang-key="settings.language">Language</label>
                    <select id="language-select" data-action="change-language">
                        <option value="en">English</option>
                        <option value="ar">العربية</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label data-lang-key="settings.theme">Theme</label>
                    <div class="theme-value" data-lang-key="settings.theme.dark">Dark (Default)</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
